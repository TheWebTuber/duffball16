name: Update ESP Live Stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Hub integration
        run: node --test tests/*.test.mjs

      - name: Read CreatorPromote Hub snapshot
        run: node scripts/update-esp.mjs

      - name: Commit ESP JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add live/esp.json
          git commit -m "Update ESP live stats" || exit 0
          git push
