<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Server Status</title>
    <link rel="stylesheet" href="css/minecraft.css" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="Duffball16 SMP - Minecraft Server"
    />
    <meta
      property="og:description"
      content="Join Duffball16 SMP! Play with friends or meet new creators in an awesome 24/7 survival world. Fully cross-platform for Java and Bedrock — build, explore, and have fun together anytime!"
    />
    <meta
      property="og:image"
      content="https://duffball16.com/img/Duffball16SMP.png"
    />
    <meta property="og:url" content="https://duffball16.com/minecraft" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Duffball16 SMP - Minecraft Server"
    />
    <meta
      name="twitter:description"
      content="Dive into the Duffball16 SMP — a cross-platform Minecraft survival world for both Java & Bedrock players. Adventure, build, and connect 24/7 with an active community!"
    />
    <meta
      name="twitter:image"
      content="https://duffball16.com/img/Duffball16SMP.png"
    />
  </head>
  <body>
    <div class="container">
      <h1>Duffball16 SMP</h1>
      <div id="status" class="status-box">Checking server status...</div>
      <div id="server-info" class="server-info hidden">
        <div class="server-grid">
          <div class="server-block">
            <p><strong>Java Edition</strong></p>
            <p><strong>IP:</strong> mc.duffball16.com</p>
          </div>
          <div class="server-block">
            <p><strong>Bedrock Edition</strong></p>
            <p><strong>IP:</strong> mc.duffball16.com</p>
            <p><strong>Port:</strong> 19133</p>
          </div>
        </div>

        <h3>Players Online</h3>

        <ul id="players"></ul>

        <section class="minecraft-map">
  <h2>DUFFBALL16 Live Map</h2>

<!-- Embed the live map using an iframe -->
  <iframe
    src="https://map.duffball16.com"
    title="DUFFBALL16 SMP Live Map"
    loading="lazy"
    allowfullscreen>
  </iframe>
</section>

      </div>
    </div>
    <script src="js/minecraft.js"></script>
  </body>
</html>
